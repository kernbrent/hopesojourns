<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hope Sojourns</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f4ee;
      color: #24332b;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
    }

    main {
      width: min(42rem, calc(100% - 3rem));
      text-align: center;
    }

    h1 {
      margin-bottom: 0.5rem;
      font-size: clamp(2.5rem, 8vw, 5rem);
      line-height: 1;
    }

    p {
      color: #526159;
      font-size: 1.15rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main>
    <h1>Hope Sojourns</h1>
    <p>Welcome. Our new website is on its way.</p>
  </main>
</body>
</html>
